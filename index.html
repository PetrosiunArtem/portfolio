        <div class="logo-card">
            <img class="html-logo logo" src="img/html-5.webp" alt="html5">
            <p class="skill-name">HTML</p>
        </div>
        <div class="logo-card">
            <img class="css-logo logo" src="img/css-3.webp" alt="css-3">
            <p class="skill-name">CSS</p>

<section id="portfolio" class="skills">

        <h2 class="skills-title-text">Portfolio</h2>

    <div class="logos">
        <div class="logo-card">
            <img class="four-rules-logo logo" src="img/four-rules.webp" alt="git">

            <img class="procrastination-logo logo" src="img/procrastination_img.webp" alt="java">

<section id="contact" class="contact">
    <div class="contact-container">
        <div>
            <h2 class="contact-text">Contact</h2>
            <form class="contact-form" action="/send" name="/sendForm" method="post" autocomplete="on">
                <label>
                    <input class="contact-form-input" type="text" placeholder="Enter your name" required>
                </label>
                <label>
                    <input class="contact-form-input" type="email" placeholder="Enter your email" required>
                </label>
                <label>
                    <textarea class="contact-form-input" type="message" placeholder="Enter your message" required></textarea>
                </label>
                <button type="submit" class="form-button">Submit</button>
            </form>
        </div>
    </div>
</section>

<footer class="footer">
