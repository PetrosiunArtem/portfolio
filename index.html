<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Portfolio</title>
        <link rel="stylesheet" href="./styles/style.css">
        <link rel="stylesheet" href="./styles/skills.css">
        <link rel="stylesheet" href="./styles/menu.css">
        <link rel="stylesheet" href="./styles/contact.css">


        <link rel="icon" type="img/logo" href="img/logo.png">
    </head>
    <body>
        <header class="header">
            <div id="menu" class="menu">
                <a class="menu-link home-link" href="#home">Home</a>
                <a class="menu-link skills-link" href="#skills">Skills</a>
                <a class="menu-link contact-link" href="#contact">Contact</a>
            </div>
        </header>

        <!-- -------------hero section------------- -->

        <div id="home" class="hero">
            <div class="spacer"></div>
            <div class="hero-content">
                <!-- <p>Welcome, Traveler!<br>Let me introduce myself.<br>I’m Ilya.</p> -->
            </div>
        </div>

        <!-- -------------skills section------------- -->

        <section id="skills" class="skills">
            <div class="skills-title">
                <h2 class="skills-title-text">My Skills</h2>
            </div>
            <h3 class="skills-subtitle">Using</h3>
            <div class="logos">
                <div class="logo-card">
                    <img class="git-logo logo" src="img/git.png" alt="git">
                    <p class="skill-name">Git</p>
                </div>
                <div class="logo-card">
                    <img class="java-logo logo" src="img/java.png" alt="java">
                    <p class="skill-name">Java</p>
                </div>
                <div class="logo-card">
                    <img class="spring-logo logo no-right-margin" src="img/spring.png" alt="spring">
                    <p class="skill-name">Spring</p>
                </div>
            </div>
            <h3 class="skills-subtitle">Learning</h3>
            <div class="logos">
                <div class="logo-card">
                    <img class="html-logo logo" src="img/html-5.png" alt="html5">
                    <p class="skill-name">HTML</p>
                </div>
                <div class="logo-card">
                    <img class="css-logo logo" src="img/css-3.png" alt="css-3">
                    <p class="skill-name">CSS</p>
                </div>
                <div class="logo-card">
                    <img class="js-logo logo no-right-margin" src="img/js.png" alt="js">
                    <p class="skill-name">JavaScript</p>
                </div>
            </div>
            <h3 class="skills-subtitle">Other skills</h3>
            <div class="logos end-of-skills">
                <div class="logo-card">
                    <img class="postgresql-logo logo" src="img/postgresql.png" alt="postgresql">
                    <p class="skill-name">PostgreSQL</p>
                </div>
                <div class="logo-card">
                    <img class="c-logo logo" src="img/c++.png" alt="c++">
                    <p class="skill-name">C++</p>
                </div>
                <div class="logo-card">
                    <img class="python-logo no-right-margin" src="img/python.png" alt="python">
                    <p class="skill-name">Python</p>
                </div>
            </div>
        </section>

        <!-- -------------contact section------------- -->
        
        <section id="contact" class="contact">
            <div class="contact-container">
                <div class="contact-left">
                    <h3>Contact</h3>
                    <form class="contact-form">
                        <input class="contact-form-input" type="text" placeholder="Enter your name" required>
                        <input class="contact-form-input" type="email" placeholder="Enter your email" required>
                        <input class="contact-form-input" type="tel" placeholder="Enter your message" required></textarea><br>
                        <textarea class="contact-form-input"  placeholder="Enter your message" required></textarea><br>
                        <button type="submit" class="form-button">Submit</button>
                    </form>
                </div>
            </div>
        </section>

        <footer class="footer">
            <p>© МФТИ</p>
        </footer>    
    </body>
</html>
